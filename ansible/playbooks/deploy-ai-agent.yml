---
# Deploy AI Agent from a prebuilt Docker image.
# Usage:
#   ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy-ai-agent.yml
#
# This playbook reads runtime secrets from agent_src/.env and registry/image
# settings from .env.deploy. Environment variables can still override files.

- name: "PHASE 5: Deploy AI Agent from Docker registry"
  hosts: monitor
  become: yes
  gather_facts: yes

  vars:
    agent_env_file: "{{ playbook_dir }}/../../agent_src/.env"
    deploy_env_file: "{{ playbook_dir }}/../../.env.deploy"
    ai_agent_image: "{{ lookup('env', 'AI_AGENT_IMAGE') or lookup('ansible.builtin.ini', 'AI_AGENT_IMAGE type=properties file=' ~ deploy_env_file ~ ' default=', errors='ignore') or ai_agent.docker_image | default('ghcr.io/your-org/aws-hybrid-ai-agent:latest') }}"
    gemini_api_key: "{{ lookup('env', 'GEMINI_API_KEY') or lookup('ansible.builtin.ini', 'GEMINI_API_KEY type=properties file=' ~ agent_env_file ~ ' default=', errors='ignore') or lookup('ansible.builtin.ini', 'GEMINI_API_KEY type=properties file=' ~ deploy_env_file ~ ' default=', errors='ignore') }}"
    telegram_token: "{{ lookup('env', 'TELEGRAM_TOKEN') or lookup('ansible.builtin.ini', 'TELEGRAM_TOKEN type=properties file=' ~ agent_env_file ~ ' default=', errors='ignore') or lookup('ansible.builtin.ini', 'TELEGRAM_TOKEN type=properties file=' ~ deploy_env_file ~ ' default=', errors='ignore') }}"
    telegram_chat_id: "{{ lookup('env', 'TELEGRAM_CHAT_ID') or lookup('ansible.builtin.ini', 'TELEGRAM_CHAT_ID type=properties file=' ~ agent_env_file ~ ' default=', errors='ignore') or lookup('ansible.builtin.ini', 'TELEGRAM_CHAT_ID type=properties file=' ~ deploy_env_file ~ ' default=', errors='ignore') }}"
    registry_host: "{{ lookup('env', 'AI_AGENT_REGISTRY') or lookup('ansible.builtin.ini', 'AI_AGENT_REGISTRY type=properties file=' ~ deploy_env_file ~ ' default=', errors='ignore') or ai_agent_image.split('/')[0] }}"
    registry_username: "{{ lookup('env', 'AI_AGENT_REGISTRY_USERNAME') or lookup('ansible.builtin.ini', 'AI_AGENT_REGISTRY_USERNAME type=properties file=' ~ deploy_env_file ~ ' default=', errors='ignore') }}"
    registry_password: "{{ lookup('env', 'AI_AGENT_REGISTRY_PASSWORD') or lookup('ansible.builtin.ini', 'AI_AGENT_REGISTRY_PASSWORD type=properties file=' ~ deploy_env_file ~ ' default=', errors='ignore') }}"

  pre_tasks:
    - name: Validate AI Agent environment variables
      fail:
        msg: "ERROR: {{ item }} environment variable is not set. Please set it before deployment."
      when: vars[item] == ''
      loop:
        - gemini_api_key
        - telegram_token
        - telegram_chat_id

    - name: Validate AI Agent image
      fail:
        msg: "ERROR: AI_AGENT_IMAGE is not set to a real registry image. Example: ghcr.io/<owner>/aws-hybrid-ai-agent:latest"
      when: ai_agent_image in ['', 'ghcr.io/your-org/aws-hybrid-ai-agent:latest']

    - name: Display AI Agent deployment information
      debug:
        msg:
          - "=========================================="
          - "Deploying AI Agent from registry image"
          - "=========================================="
          - "Target Host: {{ inventory_hostname }}"
          - "Image: {{ ai_agent_image }}"
          - "App Path: /opt/ai-agent"
          - "Port: 8000"
          - "=========================================="

  tasks:
    - name: Create AI Agent application directory
      file:
        path: /opt/ai-agent
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Remove old source files from previous source-based deployments
      shell: find /opt/ai-agent -mindepth 1 -maxdepth 1 ! -name logs -exec rm -rf {} +
      changed_when: false

    - name: Create AI Agent logs directory
      file:
        path: /opt/ai-agent/logs
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Remove temporary AI Agent source directory if present
      file:
        path: /tmp/ai-agent-src
        state: absent

    - name: Login to private Docker registry when credentials are provided
      shell: |
        set -e
        printf '%s' '{{ registry_password }}' | docker login '{{ registry_host }}' -u '{{ registry_username }}' --password-stdin
      no_log: true
      when:
        - registry_username | length > 0
        - registry_password | length > 0

    - name: Create or update AI Agent docker-compose.yml
      copy:
        content: |
          version: '3.8'
          services:
            ai-agent:
              image: "{{ ai_agent_image }}"
              container_name: ai-agent
              ports:
                - "8000:8000"
              environment:
                - GEMINI_API_KEY={{ gemini_api_key }}
                - TELEGRAM_TOKEN={{ telegram_token }}
                - TELEGRAM_CHAT_ID={{ telegram_chat_id }}
                - REDIS_HOST=ai-agent-redis
                - REDIS_PORT=6379
                - REDIS_DB=0
                - LOG_LEVEL=INFO
                - DEBUG=false
                - PYTHONUNBUFFERED=1
              depends_on:
                - ai-agent-redis
              volumes:
                - /opt/ai-agent/logs:/app/logs
              networks:
                - aiops-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

            celery-worker:
              image: "{{ ai_agent_image }}"
              container_name: celery-worker
              command: ["celery", "-A", "core.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1"]
              environment:
                - GEMINI_API_KEY={{ gemini_api_key }}
                - TELEGRAM_TOKEN={{ telegram_token }}
                - TELEGRAM_CHAT_ID={{ telegram_chat_id }}
                - REDIS_HOST=ai-agent-redis
                - REDIS_PORT=6379
                - REDIS_DB=0
                - LOG_LEVEL=INFO
                - DEBUG=false
                - PYTHONUNBUFFERED=1
              depends_on:
                - ai-agent-redis
              volumes:
                - /opt/ai-agent/logs:/app/logs
              networks:
                - aiops-network
              restart: unless-stopped

            ai-agent-redis:
              image: redis:7-alpine
              container_name: ai-agent-redis
              command: redis-server --appendonly yes
              volumes:
                - ai_agent_redis_data:/data
              networks:
                - aiops-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 30s
                timeout: 10s
                retries: 3

          networks:
            aiops-network:
              driver: bridge

          volumes:
            ai_agent_redis_data:
        dest: /opt/ai-agent/docker-compose.yml
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Pull AI Agent Docker image
      shell: |
        cd /opt/ai-agent
        docker-compose pull
      register: ai_agent_pull
      changed_when: "'Downloaded newer image' in ai_agent_pull.stdout or 'Pulling' in ai_agent_pull.stdout or 'Pull complete' in ai_agent_pull.stdout"
      retries: 3
      delay: 10

    - name: Start AI Agent
      shell: |
        cd /opt/ai-agent
        docker-compose up -d --force-recreate
      register: ai_agent_start
      changed_when: "'Started' in ai_agent_start.stderr or 'Creating' in ai_agent_start.stderr or 'Recreating' in ai_agent_start.stderr"
      retries: 3
      delay: 5

    - name: Wait for AI Agent to be ready
      wait_for:
        port: 8000
        delay: 5
        timeout: 60
        host: localhost

    - name: Verify AI Agent is responding
      uri:
        url: "http://localhost:8000/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 5
      register: ai_agent_health
      until: ai_agent_health.status == 200

    - name: Display AI Agent deployment status
      debug:
        msg:
          - "=========================================="
          - "AI Agent deployed successfully"
          - "=========================================="
          - "Image: {{ ai_agent_image }}"
          - "Service: ai-agent"
          - "Port: 8000"
          - "Status: {{ ai_agent_health.status }}"
          - "Access: http://{{ ansible_default_ipv4.address }}:8000"
          - "=========================================="
