---
- name: Configure image-based release runtime on monitor host
  hosts: monitor
  become: yes
  gather_facts: yes

  vars:
    release_root: /home/ec2-user/aws-hybrid

  tasks:
    - name: Create release runtime directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
      loop:
        - "{{ release_root }}"
        - "{{ release_root }}/release"
        - "{{ release_root }}/release/database"
        - "{{ release_root }}/automation"
        - "{{ release_root }}/release/.state"

    - name: Install versioned release compose manifests
      copy:
        src: "{{ playbook_dir }}/../../release/{{ item }}"
        dest: "{{ release_root }}/release/{{ item }}"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      loop:
        - docker-compose.staging.yml
        - docker-compose.production.yml
        - .env.example

    - name: Install database initialization scripts
      copy:
        src: "{{ playbook_dir }}/../../demo-web/database/{{ item }}"
        dest: "{{ release_root }}/release/database/{{ item }}"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      loop:
        - init.sql
        - seed.sql

    - name: Install release deployment script
      copy:
        src: "{{ playbook_dir }}/../../automation/app-release-deploy.sh"
        dest: "{{ release_root }}/automation/app-release-deploy.sh"
        owner: ec2-user
        group: ec2-user
        mode: '0755'
