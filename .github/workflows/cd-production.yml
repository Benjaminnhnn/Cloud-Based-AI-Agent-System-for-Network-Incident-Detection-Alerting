name: CD Production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      build_matrix: ${{ steps.vars.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo 'build_matrix={"include":[{"role":"monitor","image":"aws-hybrid-ai-agent","context":"./agent_src"},{"role":"core","image":"aws-hybrid-payment-api","context":"./demo-web/backend"},{"role":"web","image":"aws-hybrid-frontend","context":"./demo-web/frontend"}]}' >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: prepare-release
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-release.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.role }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ needs.prepare-release.outputs.owner_lc }}/${{ matrix.image }}:${{ needs.prepare-release.outputs.image_tag }}
            ghcr.io/${{ needs.prepare-release.outputs.owner_lc }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ needs.prepare-release.outputs.owner_lc }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-and-push]
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: monitor
          - role: core
          - role: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_AGENT_PUBLIC_URL: ${{ secrets.AI_AGENT_PUBLIC_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYMENT_API_UPSTREAM: ${{ secrets.PAYMENT_API_UPSTREAM }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          cp release/.env.example release/.env.production
          sed -i "s/^GHCR_OWNER=.*/GHCR_OWNER=${{ needs.prepare-release.outputs.owner_lc }}/" release/.env.production
          python - <<'PY'
          import os
          from pathlib import Path

          def inventory_value(group: str, key: str) -> str:
              inventory = Path("ansible/inventory.ini")
              if not inventory.exists():
                  return ""

              in_group = False
              for line in inventory.read_text().splitlines():
                  stripped = line.strip()
                  if stripped == f"[{group}]":
                      in_group = True
                      continue
                  if stripped.startswith("["):
                      in_group = False
                  if not in_group or "ansible_host=" not in stripped:
                      continue
                  for part in stripped.split():
                      if part.startswith(f"{key}="):
                          return part.split("=", 1)[1]
              return ""

          core_host = inventory_value("core", "private_ip") or inventory_value("core", "ansible_host")
          payment_api_upstream = (
              f"http://{core_host}:8080" if core_host else os.environ.get("PAYMENT_API_UPSTREAM")
          )
          if not payment_api_upstream:
              raise SystemExit("Missing required environment variable: PAYMENT_API_UPSTREAM")
          payment_api_upstream = payment_api_upstream.strip()
          if not payment_api_upstream.startswith(("http://", "https://")):
              raise SystemExit("PAYMENT_API_UPSTREAM must include http:// or https://")
          values = {
              "ENVIRONMENT": "production",
              "PAYMENT_API_UPSTREAM": payment_api_upstream,
          }
          for key in (
              "GEMINI_API_KEY",
              "TELEGRAM_TOKEN",
              "TELEGRAM_CHAT_ID",
              "AI_AGENT_PUBLIC_URL",
              "DATABASE_URL",
              "SECRET_KEY",
              "PROMETHEUS_URL",
          ):
              value = os.environ.get(key, "")
              if value:
                  values[key] = value

          env_file = Path("release/.env.production")
          lines = env_file.read_text().splitlines()
          existing = {line.split("=", 1)[0] for line in lines if "=" in line and not line.startswith("#")}
          updated = []
          for line in lines:
              key = line.split("=", 1)[0] if "=" in line and not line.startswith("#") else None
              updated.append(f"{key}={values[key]}" if key in values else line)
          for key, value in values.items():
              if key not in existing:
                  updated.append(f"{key}={value}")
          env_file.write_text("\n".join(updated) + "\n")
          PY

      - name: Package database init scripts
        run: |
          mkdir -p release/database
          cp demo-web/database/*.sql release/database/

      - name: Resolve deploy host
        id: deploy-host
        env:
          MONITOR_SSH_HOST: ${{ secrets.MONITOR_SSH_HOST }}
          CORE_SSH_HOST: ${{ secrets.CORE_SSH_HOST }}
          WEB_SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
          DEPLOY_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          inventory_host() {
            local group="$1"
            awk -v group="[$group]" '
              $0 == group { in_group=1; next }
              /^\[/ { in_group=0 }
              in_group && /ansible_host=/ {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^ansible_host=/) {
                    sub(/^ansible_host=/, "", $i)
                    print $i
                    exit
                  }
                }
              }
            ' ansible/inventory.ini
          }

          case "$DEPLOY_ROLE" in
            monitor) host="$(inventory_host monitor)" ;;
            core) host="$(inventory_host core)" ;;
            web) host="$(inventory_host web)" ;;
          esac
          if [ -z "$host" ]; then
            case "$DEPLOY_ROLE" in
              monitor) host="$MONITOR_SSH_HOST" ;;
              core) host="$CORE_SSH_HOST" ;;
              web) host="$WEB_SSH_HOST" ;;
            esac
          fi
          test -n "$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ matrix.role }} to EC2
        env:
          TARGET_HOST: ${{ steps.deploy-host.outputs.host }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_ENVIRONMENT: production
          DEPLOY_ROLE: ${{ matrix.role }}
          IMAGE_TAG: ${{ needs.prepare-release.outputs.image_tag }}
          GHCR_OWNER: ${{ needs.prepare-release.outputs.owner_lc }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          MIN_DOCKER_FREE_MB: 12288
        run: bash automation/github-deploy-role.sh
