name: CD Production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push AI Agent
        uses: docker/build-push-action@v6
        with:
          context: ./agent_src
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-ai-agent:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-ai-agent:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-ai-agent:latest

      - name: Build & push Payment API
        uses: docker/build-push-action@v6
        with:
          context: ./demo-web/backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-payment-api:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-payment-api:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-payment-api:latest

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./demo-web/frontend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-frontend:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-frontend:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/aws-hybrid-frontend:latest

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: monitor
          - role: core
          - role: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_AGENT_PUBLIC_URL: ${{ secrets.AI_AGENT_PUBLIC_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYMENT_API_UPSTREAM: ${{ secrets.PAYMENT_API_UPSTREAM }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          cp release/.env.example release/.env.production
          sed -i "s/^GHCR_OWNER=.*/GHCR_OWNER=${{ needs.build-and-push.outputs.owner_lc }}/" release/.env.production
          python - <<'PY'
          import os
          from pathlib import Path

          values = {
              "ENVIRONMENT": "production",
              "PAYMENT_API_UPSTREAM": os.environ.get("PAYMENT_API_UPSTREAM") or "http://10.10.1.118:8080",
          }
          for key in (
              "GEMINI_API_KEY",
              "TELEGRAM_TOKEN",
              "TELEGRAM_CHAT_ID",
              "AI_AGENT_PUBLIC_URL",
              "DATABASE_URL",
              "SECRET_KEY",
              "PROMETHEUS_URL",
          ):
              value = os.environ.get(key, "")
              if value:
                  values[key] = value

          env_file = Path("release/.env.production")
          lines = env_file.read_text().splitlines()
          existing = {line.split("=", 1)[0] for line in lines if "=" in line and not line.startswith("#")}
          updated = []
          for line in lines:
              key = line.split("=", 1)[0] if "=" in line and not line.startswith("#") else None
              updated.append(f"{key}={values[key]}" if key in values else line)
          for key, value in values.items():
              if key not in existing:
                  updated.append(f"{key}={value}")
          env_file.write_text("\n".join(updated) + "\n")
          PY

      - name: Package database init scripts
        run: |
          mkdir -p release/database
          cp demo-web/database/*.sql release/database/

      - name: Resolve deploy host
        id: deploy-host
        env:
          MONITOR_SSH_HOST: ${{ secrets.MONITOR_SSH_HOST }}
          CORE_SSH_HOST: ${{ secrets.CORE_SSH_HOST }}
          WEB_SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
          DEPLOY_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          case "$DEPLOY_ROLE" in
            monitor) host="$MONITOR_SSH_HOST" ;;
            core) host="$CORE_SSH_HOST" ;;
            web) host="$WEB_SSH_HOST" ;;
          esac
          test -n "$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ matrix.role }} to EC2
        env:
          TARGET_HOST: ${{ steps.deploy-host.outputs.host }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_ENVIRONMENT: production
          DEPLOY_ROLE: ${{ matrix.role }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_OWNER: ${{ needs.build-and-push.outputs.owner_lc }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MIN_DOCKER_FREE_MB: 12288
        run: bash automation/github-deploy-role.sh
