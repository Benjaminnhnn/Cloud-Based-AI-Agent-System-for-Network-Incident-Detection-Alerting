<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIOps System Architecture</title>
  <style>
    body {
      margin: 0;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
    }
    header {
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #d9dee5;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
    }
    header p {
      margin: 6px 0 0;
      color: #4d5562;
      font-size: 13px;
    }
    main {
      padding: 20px;
    }
    .canvas {
      background: #fff;
      border: 1px solid #d9dee5;
      box-shadow: 0 2px 14px rgba(15, 23, 42, 0.08);
      overflow: auto;
    }
    img {
      display: block;
      width: 1800px;
      max-width: none;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cloud-Based AIOps Agent System for Network Incident Detection and Alerting</h1>
    <p>Open this file in a browser for preview, or import the SVG directly into Miro.</p>
  </header>
  <main>
    <div class="canvas">
      <img src="./aiops-system-architecture.svg" alt="AIOps system architecture diagram">
    </div>
  </main>
</body>
</html>
