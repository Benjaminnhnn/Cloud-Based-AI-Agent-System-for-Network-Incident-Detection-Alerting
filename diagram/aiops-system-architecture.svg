    <text x="1293" y="601" class="cardSub">9187/19187</text>
  </g>
  <g id="core-node-exporter">
    <rect x="1380" y="560" width="116" height="54" rx="8" fill="#f4fbff" stroke="#2689c9"/>
    <text x="1438" y="586" class="cardText">Node Exp.</text>
    <text x="1438" y="601" class="cardSub">9100</text>
  </g>
  <g id="core-cadvisor">
    <rect x="1525" y="560" width="78" height="54" rx="8" fill="#f4fbff" stroke="#2689c9"/>
    <text x="1564" y="586" class="cardText">cAdv.</text>
    <text x="1564" y="601" class="cardSub">8088</text>
  </g>

  <rect x="1195" y="730" width="430" height="140" rx="8" class="group"/>
  <text x="1215" y="755" class="label" fill="#42a047">Release Runtime</text>
  <g>
    <rect x="1235" y="785" width="116" height="54" rx="8" fill="#fff5fb" stroke="#d62d8a"/>
    <text x="1293" y="812" class="cardText">payment-api</text>
    <text x="1293" y="827" class="cardSub">FastAPI</text>
  </g>
  <g>
    <rect x="1455" y="785" width="116" height="54" rx="8" fill="#fff5fb" stroke="#d62d8a"/>
    <text x="1513" y="812" class="cardText">postgres</text>
    <text x="1513" y="827" class="cardSub">volume</text>
  </g>

  <!-- Primary app flow -->
  <path class="greenLine" d="M155 177 C155 260 600 315 815 455"/>
  <text x="405" y="282" class="small" fill="#2e9d58">HTTP</text>
  <path class="greenLine" d="M876 492 L930 492"/>
  <text x="894" y="480" class="small" fill="#2e9d58">static</text>
  <path class="greenLine" d="M1036 492 C1110 492 1165 492 1235 492"/>
  <text x="1112" y="478" class="small" fill="#2e9d58">/api</text>
  <path class="greenLine" d="M1351 492 L1455 492"/>
  <text x="1378" y="478" class="small" fill="#2e9d58">DATABASE_URL</text>

