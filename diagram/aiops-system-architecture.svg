  <text x="760" y="680" class="small" fill="#7e4ee8">AI analysis</text>
  <path class="purpleLine" d="M1170 177 C1120 300 780 730 600 690"/>
  <path class="purpleLine" d="M547 729 L448 798"/>
  <path class="purpleLine" d="M448 798 L494 798"/>
  <path class="purpleLine" d="M547 729 C760 870 1110 890 1395 177"/>
  <text x="1030" y="895" class="small" fill="#7e4ee8">notify incident</text>
  <path class="purpleLine" d="M1470 136 L1550 136"/>

