<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e9d58"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2689c9"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d64545"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7e4ee8"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #111; }
      .subtitle { font: 600 15px Arial, Helvetica, sans-serif; fill: #111; }
      .label { font: 600 15px Arial, Helvetica, sans-serif; fill: #111; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #333; }
      .tiny { font: 11px Arial, Helvetica, sans-serif; fill: #444; }
      .region { fill: #fbfdff; stroke: #2689c9; stroke-width: 2.2; }
      .region-tab { fill: #2689c9; }
      .vpc { fill: #fcfffb; stroke: #42a047; stroke-width: 1.8; }
      .node { fill: #fff; stroke: #2c97c6; stroke-width: 1.7; }
      .group { fill: #fff; stroke: #77b96b; stroke-width: 1.4; }
      .ext { fill: #f9f5ff; stroke: #9867e8; stroke-width: 1.4; }
      .ops { fill: #fff5fb; stroke: #d62d8a; stroke-width: 1.4; }
      .legend { fill: #f7f4ff; stroke: #606060; stroke-width: 1.2; }
      .cardText { font: 700 11px Arial, Helvetica, sans-serif; fill: #111; text-anchor: middle; }
      .cardSub { font: 10px Arial, Helvetica, sans-serif; fill: #333; text-anchor: middle; }
      .iconText { font: 700 18px Arial, Helvetica, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .greenLine { fill: none; stroke: #2e9d58; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .blueLine { fill: none; stroke: #2689c9; stroke-width: 2.1; stroke-dasharray: 8 6; marker-end: url(#arrowBlue); }
      .redLine { fill: none; stroke: #d64545; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrowRed); }
      .purpleLine { fill: none; stroke: #7e4ee8; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#arrowPurple); }
      .grayLine { fill: none; stroke: #666; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrowGray); }
      .noteLine { font: 12px Arial, Helvetica, sans-serif; fill: #111; }
    </style>
