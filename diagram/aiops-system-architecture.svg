    <rect x="803" y="465" width="40" height="34" rx="7" fill="#2e9d58"/>
    <text x="823" y="483" class="iconText">R</text>
    <text x="823" y="517" class="cardText">React UI</text>
  </g>
  <g id="nginx">
    <rect x="930" y="455" width="106" height="74" rx="8" fill="#fff" stroke="#2e9d58"/>
    <rect x="963" y="465" width="40" height="34" rx="7" fill="#2e9d58"/>
    <text x="983" y="483" class="iconText">NX</text>
    <text x="983" y="517" class="cardText">Nginx</text>
  </g>
  <g id="web-node-exporter">
    <rect x="770" y="560" width="106" height="54" rx="8" fill="#f4fbff" stroke="#2689c9"/>
    <text x="823" y="586" class="cardText">Node Exp.</text>
    <text x="823" y="601" class="cardSub">9100</text>
  </g>
  <g id="web-cadvisor">
    <rect x="930" y="560" width="106" height="54" rx="8" fill="#f4fbff" stroke="#2689c9"/>
    <text x="983" y="586" class="cardText">cAdvisor</text>
    <text x="983" y="601" class="cardSub">8088</text>
  </g>

  <rect x="735" y="700" width="345" height="170" rx="8" class="group"/>
  <text x="755" y="725" class="label" fill="#42a047">Release Runtime</text>
  <g>
    <rect x="770" y="755" width="106" height="64" rx="8" fill="#fff5fb" stroke="#d62d8a"/>
    <text x="823" y="783" class="cardText">frontend-web</text>
    <text x="823" y="799" class="cardSub">staging/prod</text>
  </g>
  <g>
    <rect x="930" y="755" width="106" height="64" rx="8" fill="#fff5fb" stroke="#d62d8a"/>
    <text x="983" y="783" class="cardText">Docker</text>
    <text x="983" y="799" class="cardSub">Compose</text>
  </g>

  <!-- EC2 core node -->
  <rect x="1160" y="330" width="500" height="620" rx="8" class="node"/>
  <text x="1410" y="358" text-anchor="middle" class="subtitle">EC2 bank-core-01</text>
  <text x="1410" y="378" text-anchor="middle" class="small">Backend + database node</text>

  <rect x="1195" y="400" width="430" height="285" rx="8" class="group"/>
  <text x="1215" y="425" class="label" fill="#42a047">Backend and Database Stack</text>
  <g id="payment-api">
    <rect x="1235" y="455" width="116" height="74" rx="8" fill="#fff" stroke="#2e9d58"/>
    <rect x="1273" y="465" width="40" height="34" rx="7" fill="#2e9d58"/>
    <text x="1293" y="483" class="iconText">API</text>
    <text x="1293" y="517" class="cardText">Payment API</text>
  </g>
  <g id="postgres">
    <rect x="1455" y="455" width="116" height="74" rx="8" fill="#fff" stroke="#336791"/>
    <rect x="1493" y="465" width="40" height="34" rx="7" fill="#336791"/>
    <text x="1513" y="483" class="iconText">DB</text>
    <text x="1513" y="517" class="cardText">PostgreSQL</text>
  </g>
  <g id="postgres-exporter">
    <rect x="1235" y="560" width="116" height="54" rx="8" fill="#f4fbff" stroke="#2689c9"/>
