  <rect x="0" y="0" width="1800" height="1300" fill="#fff"/>
  <text x="900" y="45" text-anchor="middle" class="title">Cloud-Based AIOps Agent System for Network Incident Detection and Alerting</text>
  <text x="900" y="73" text-anchor="middle" class="small">AWS-style architecture view based on Terraform, Ansible, Prometheus, Alertmanager, FastAPI, Celery, Redis, RAG, Gemini and Telegram</text>

  <!-- External services row -->
  <g id="external-row">
    <rect x="85" y="95" width="140" height="82" rx="8" class="ext"/>
    <rect x="132" y="110" width="46" height="40" rx="8" fill="#2e9d58"/>
    <text x="155" y="131" class="iconText">U</text>
    <text x="155" y="166" class="cardText">User Browser</text>

    <rect x="335" y="95" width="150" height="82" rx="8" class="ext"/>
    <rect x="387" y="110" width="46" height="40" rx="8" fill="#606060"/>
    <text x="410" y="131" class="iconText">GA</text>
    <text x="410" y="166" class="cardText">GitHub Actions</text>

    <rect x="545" y="95" width="150" height="82" rx="8" class="ext"/>
    <rect x="597" y="110" width="46" height="40" rx="8" fill="#e77717"/>
    <text x="620" y="131" class="iconText">R</text>
    <text x="620" y="166" class="cardText">GHCR Registry</text>

    <rect x="1095" y="95" width="150" height="82" rx="8" class="ext"/>
    <rect x="1147" y="110" width="46" height="40" rx="8" fill="#7e4ee8"/>
    <text x="1170" y="131" class="iconText">AI</text>
    <text x="1170" y="166" class="cardText">Gemini API</text>

    <rect x="1320" y="95" width="150" height="82" rx="8" class="ext"/>
    <rect x="1372" y="110" width="46" height="40" rx="8" fill="#d62d8a"/>
    <text x="1395" y="131" class="iconText">TG</text>
    <text x="1395" y="166" class="cardText">Telegram Bot</text>

    <rect x="1550" y="95" width="150" height="82" rx="8" class="ext"/>
    <rect x="1602" y="110" width="46" height="40" rx="8" fill="#d64545"/>
    <text x="1625" y="131" class="iconText">OP</text>
    <text x="1625" y="166" class="cardText">Admin / Operator</text>
  </g>

  <!-- AWS region and VPC -->
  <rect x="55" y="205" width="1690" height="850" rx="8" class="region"/>
  <rect x="55" y="205" width="42" height="34" rx="6" class="region-tab"/>
  <text x="112" y="226" class="subtitle" fill="#2689c9">AWS Region: ap-southeast-1</text>
  <text x="1510" y="226" class="small">Terraform provisions VPC, subnet, SG, EC2, EIP</text>

  <rect x="105" y="260" width="1590" height="745" rx="8" class="vpc"/>
  <text x="130" y="287" class="subtitle" fill="#42a047">VPC 10.10.0.0/16</text>
  <text x="130" y="306" class="small">Public subnet 10.10.1.0/24, Internet Gateway, Security Groups</text>

  <!-- EC2 monitor node -->
  <rect x="135" y="330" width="520" height="620" rx="8" class="node"/>
  <text x="395" y="358" text-anchor="middle" class="subtitle">EC2 monitor-ai-01</text>
  <text x="395" y="378" text-anchor="middle" class="small">Monitoring + AI Agent node</text>

  <rect x="160" y="400" width="470" height="170" rx="8" class="group"/>
  <text x="180" y="425" class="label" fill="#42a047">Monitoring Stack</text>

  <g id="prometheus">
    <rect x="190" y="445" width="96" height="70" rx="8" fill="#fff" stroke="#e45c5c"/>
    <rect x="218" y="455" width="40" height="34" rx="7" fill="#e45c5c"/>
    <text x="238" y="473" class="iconText">P</text>
    <text x="238" y="507" class="cardText">Prometheus</text>
  </g>
  <g id="alertmanager">
    <rect x="322" y="445" width="96" height="70" rx="8" fill="#fff" stroke="#d64545"/>
    <rect x="350" y="455" width="40" height="34" rx="7" fill="#d64545"/>
    <text x="370" y="473" class="iconText">AM</text>
    <text x="370" y="507" class="cardText">Alertmanager</text>
  </g>
  <g id="grafana">
    <rect x="454" y="445" width="96" height="70" rx="8" fill="#fff" stroke="#f37c22"/>
    <rect x="482" y="455" width="40" height="34" rx="7" fill="#f37c22"/>
    <text x="502" y="473" class="iconText">G</text>
    <text x="502" y="507" class="cardText">Grafana</text>
  </g>
  <g id="blackbox">
    <rect x="190" y="520" width="96" height="40" rx="8" fill="#f4fbff" stroke="#2689c9"/>
    <text x="238" y="545" class="cardText">Blackbox</text>
  </g>
  <g id="redis-exporter">
    <rect x="322" y="520" width="96" height="40" rx="8" fill="#f4fbff" stroke="#2689c9"/>
    <text x="370" y="545" class="cardText">Redis Exp.</text>
  </g>
  <g id="mon-exporters">
    <rect x="454" y="520" width="96" height="40" rx="8" fill="#f4fbff" stroke="#2689c9"/>
    <text x="502" y="545" class="cardText">Node/cAdv.</text>
  </g>

  <rect x="160" y="605" width="470" height="250" rx="8" class="group"/>
  <text x="180" y="630" class="label" fill="#42a047">AI Agent Stack</text>

  <g id="fastapi-agent">
    <rect x="190" y="655" width="106" height="74" rx="8" fill="#fff" stroke="#7e4ee8"/>
    <rect x="223" y="665" width="40" height="34" rx="7" fill="#7e4ee8"/>
    <text x="243" y="683" class="iconText">API</text>
    <text x="243" y="717" class="cardText">FastAPI</text>
  </g>
  <g id="redis-queue">
    <rect x="342" y="655" width="106" height="74" rx="8" fill="#fff" stroke="#cf2d44"/>
    <rect x="375" y="665" width="40" height="34" rx="7" fill="#cf2d44"/>
    <text x="395" y="683" class="iconText">R</text>
    <text x="395" y="717" class="cardText">Redis Queue</text>
  </g>
  <g id="celery-worker">
    <rect x="494" y="655" width="106" height="74" rx="8" fill="#fff" stroke="#47a447"/>
    <rect x="527" y="665" width="40" height="34" rx="7" fill="#47a447"/>
    <text x="547" y="683" class="iconText">CW</text>
    <text x="547" y="717" class="cardText">Celery</text>
  </g>
  <g id="rule-diagnosis">
    <rect x="190" y="765" width="106" height="66" rx="8" fill="#fff8f1" stroke="#f37c22"/>
    <text x="243" y="792" class="cardText">Rule-based</text>
    <text x="243" y="808" class="cardSub">Diagnosis</text>
  </g>
  <g id="rag-engine">
    <rect x="342" y="765" width="106" height="66" rx="8" fill="#f8f2ff" stroke="#7e4ee8"/>
    <text x="395" y="792" class="cardText">RAG Engine</text>
    <text x="395" y="808" class="cardSub">ChromaDB</text>
  </g>
  <g id="runbooks">
    <rect x="494" y="765" width="106" height="66" rx="8" fill="#fff" stroke="#777"/>
    <text x="547" y="792" class="cardText">Runbooks</text>
    <text x="547" y="808" class="cardSub">KB + History</text>
  </g>

