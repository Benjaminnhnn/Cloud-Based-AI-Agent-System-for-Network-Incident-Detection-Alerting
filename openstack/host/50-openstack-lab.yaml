network:
  version: 2
  renderer: networkd
  ethernets:
    ens33:
      dhcp4: true
      dhcp6: false
      dhcp4-overrides:
        route-metric: 100
    ens34:
      dhcp4: true
      dhcp6: false
      dhcp4-overrides:
        use-routes: false
        use-dns: false
    ens38:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
      optional: true
