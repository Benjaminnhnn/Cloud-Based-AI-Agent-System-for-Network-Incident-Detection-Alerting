---
# OpenStack 2026.1 all-in-one lab on Ubuntu 24.04.
kolla_base_distro: "ubuntu"
openstack_release: "2026.1"
kolla_container_engine: "docker"

# Management, API and overlay traffic use the bridged management NIC.
network_interface: "ens33"
api_interface: "ens33"
tunnel_interface: "ens33"

# No spare management IP is available in this lab. Bind APIs directly to the
# host address instead of deploying HAProxy/Keepalived around a virtual IP.
kolla_internal_vip_address: "192.168.1.3"
enable_haproxy: false
enable_keepalived: false

# Neutron consumes this addressless NIC and attaches it to br-ex.
neutron_external_interface: "ens38"
neutron_plugin_agent: "openvswitch"
enable_neutron_provider_networks: true

# VMware does not expose nested hardware virtualisation to this Ubuntu guest.
nova_compute_virt_type: "qemu"

# Initial core deployment scope.
enable_horizon: true
enable_cinder: false
enable_swift: false
